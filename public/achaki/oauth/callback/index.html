<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACHAki Autopilot — Callback de Autorização</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 44, 0.85);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #172554 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .icon svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .code-container {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .code-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      color: #38bdf8;
      overflow-x: auto;
      white-space: nowrap;
      text-align: left;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: #2563eb;
      box-shadow: 0 0 15px var(--primary-glow);
    }
    .instructions {
      background: rgba(59, 130, 246, 0.08);
      border-left: 3px solid var(--primary);
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: left;
      line-height: 1.5;
    }
    .footer {
      margin-top: 26px;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1>Autorização Concluída!</h1>
    <p>O Mercado Livre gerou o código de autorização para a sua aplicação.</p>

    <div class="code-container">
      <div id="codeDisplay" class="code-box">Carregando código...</div>
      <button id="copyBtn" class="btn" onclick="copyCode()">Copiar Código</button>
    </div>

    <div class="instructions">
      <strong>Próximo passo:</strong> Volte ao terminal onde o comando <code>npm run oauth:ml</code> está em execução e cole o código acima (ou a URL completa da barra de endereços).
    </div>

    <div class="footer">
      ACHAki Autopilot • Callback Seguro
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';

    const display = document.getElementById('codeDisplay');
    const copyBtn = document.getElementById('copyBtn');

    if (code) {
      display.textContent = code;
    } else {
      display.textContent = 'Nenhum código detectado na URL.';
      copyBtn.style.display = 'none';
    }

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        copyBtn.textContent = 'Copiado!';
        copyBtn.style.background = '#10b981';
        setTimeout(() => {
          copyBtn.textContent = 'Copiar Código';
          copyBtn.style.background = '#3b82f6';
        }, 2000);
      });
    }
  </script>
</body>
</html>
